[project]
name = "higgs-audio-v2-unofficial"
version = "1.0.0"
description = "Unofficial implementation of HiggsAudiov2 audio tokenizer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Aditya Pujari"}]
license = {text = "MIT"}
keywords = ["audio", "codec", "higgs-audio-v2", "higgs-audio", "compression", "neural-audio-codec", "audio-processing"]

dependencies = [
  "torch>=2.2.2", # 📌
  "torchaudio>=2.2.2",
  "einops>=0.8.0",
  "librosa>=0.10.0",
  "numpy>=1.26.4",
  "pyyaml>=6.0",
  "scipy>=1.14.0",
  "soundfile>=0.12.1",
  "tensorboard>=2.18.0",
  "tqdm>=4.66.4",
  "wandb>=0.17.3",
  "click>=8.1.7",
  "pesq>=0.0.4",
  "pystoi>=0.3.3",
  "resampy>=0.3.1",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.7.1",
  "transformers>=4.38.0",
  "vector-quantize-pytorch>=1.14.0",
  "huggingface-hub>=0.20.0",
  "tabulate>=0.9.0",
  "matplotlib>=3.10.5",
  "seaborn>=0.13.2",
  "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/pujariaditya/HiggsAudiov2TokenizerUnofficial"
Repository = "https://github.com/pujariaditya/HiggsAudiov2TokenizerUnofficial"
"DAC Architecture Reference" = "https://github.com/descriptinc/dac"

[dependency-groups]
gpu = [
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.2/flash_attn-2.5.2+cu118torch2.2cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
  "bitsandbytes>=0.43.1",
]
dev = [
  "pre-commit>=4.0.1",
  "pytest>=7.1.2",
  "ruff>=0.8.1",
  "matplotlib>=3.9.0"
]
cloud = [
  "google-cloud-storage>=2.10.0",
  "boto3>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["HiggsAudioTokenizer"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
audiotokenizer = "cli:audiotokenizer"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or McCabe
# complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F", # Flake8
  "I", # isort
]
